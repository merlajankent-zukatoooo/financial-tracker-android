          FINANCE_CODE
          base64 --decode "$RUNNER_TEMP/financial-tracker-code.b64" > "$RUNNER_TEMP/financial-tracker-code.zip"
          unzip -q "$RUNNER_TEMP/financial-tracker-code.zip" -d "$RUNNER_TEMP/financial-tracker-source"
          cd "$RUNNER_TEMP/financial-tracker-source"
          echo 'Android source files:'
          find . -maxdepth 3 -type f | sort
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          grep -Fq "id 'com.android.application'" app/build.gradle
          echo 'Verified: Android application plugin is present in the app module.'

      - name: Confirm Android assembleDebug task exists
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/financial-tracker-source"
          gradle --no-daemon --console=plain :app:tasks --all > "$RUNNER_TEMP/financial-tracker-tasks.log"
          if ! grep -Eq '^[[:space:]]*assembleDebug([[:space:]]|$)' "$RUNNER_TEMP/financial-tracker-tasks.log"; then
            echo 'assembleDebug task missing. Here are the module tasks:'
            cat "$RUNNER_TEMP/financial-tracker-tasks.log"
            exit 1
          fi
          echo 'Confirmed :app:assembleDebug task is available.'

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/financial-tracker-source"
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Financial-Tracker-APK
          path: ${{ runner.temp }}/financial-tracker-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
