# Complete Android build workflow for Personal Financial Tracker.
# Builds a clean Android project from the included source archive, so a missing
# or misplaced build.gradle in the GitHub repository will not break the build.
name: Financial Tracker APK - Repair Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'

      - name: Install Android 35 and build tools
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create clean Android project from bundled source
        shell: bash
